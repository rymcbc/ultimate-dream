name: Proposal Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  proposal-check:
    name: proposal-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap waiver (the gate cannot approve the PR that creates it)
        id: waiver
        run: |
          BODY="${{ github.event.pull_request.body }}"
          if echo "$BODY" | grep -qi "Bootstrap-Waiver: WAIVER-0001"; then
            if [ -f ledger/WAIVER-0001.md ]; then
              echo "waived=true" >> $GITHUB_OUTPUT
              echo "✓ Bootstrap-Waiver: WAIVER-0001 present and ledger/WAIVER-0001.md exists — proposal requirement waived for this one PR"
              exit 0
            fi
            echo "✗ PR cites WAIVER-0001 but ledger/WAIVER-0001.md is not in the tree"
            exit 1
          fi
          echo "waived=false" >> $GITHUB_OUTPUT

      - name: Check PR description for Approved-Proposal
        id: check
        if: steps.waiver.outputs.waived != 'true'
        run: |
          BODY="${{ github.event.pull_request.body }}"
          if echo "$BODY" | grep -qi "Approved-Proposal: UD-[0-9]\+"; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "✓ Found valid Approved-Proposal reference"
            echo "$BODY" | grep -i "Approved-Proposal:"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "✗ PR description must contain 'Approved-Proposal: UD-###' (e.g., UD-001)"
            exit 1
          fi

      - name: Verify proposal exists in DECISIONS/
        if: steps.check.outputs.found == 'true'
        run: |
          BODY="${{ github.event.pull_request.body }}"
          PROPOSAL_NUM=$(echo "$BODY" | grep -i "Approved-Proposal:" | sed -E 's/.*UD-([0-9]+).*/\1/')
          PROPOSAL_FILE="DECISIONS/UD-${PROPOSAL_NUM}.md"
          if [ -f "$PROPOSAL_FILE" ]; then
            echo "✓ Proposal file exists: $PROPOSAL_FILE"
          else
            echo "✗ Proposal file not found: $PROPOSAL_FILE"
            echo "Passed proposals must be recorded in DECISIONS/UD-###.md"
            exit 1
          fi
