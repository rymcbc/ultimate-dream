name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (for prettier, markdownlint)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python (for the test suites)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A gate that lints but never executes the tests is theatre: a PR can report
      # "14/14 green" while the suite it cites has never run in CI. This step is
      # the one that makes every other green check mean something.
      - name: Install test dependencies
        run: python -m pip install --quiet pytest pytest-asyncio cryptography

      - name: Run test suites
        run: python -m pytest -q -p no:cacheprovider tests governance service fanout accounts

      - name: Install lint tools
        run: |
          npm ci 2>/dev/null || npm install --save-dev prettier markdownlint-cli @commitlint/cli @commitlint/config-conventional

      # Lint what this change touches, not the whole repository. A formatting rule that
      # fires on files nobody edited turns every unrelated push red — noise, not signal.
      - name: Files changed by this push or PR
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || echo "$BASE" | grep -q '^0\{40\}$'; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          git diff --name-only --diff-filter=ACMR "$BASE" HEAD > "$RUNNER_TEMP/changed.txt" || true
          grep -E '\.(md|ya?ml|json)$' "$RUNNER_TEMP/changed.txt" | grep -v '^node_modules/' > "$RUNNER_TEMP/lint.txt" || true
          grep -E '\.md$' "$RUNNER_TEMP/lint.txt" > "$RUNNER_TEMP/lint-md.txt" || true
          echo "lint_count=$(wc -l < "$RUNNER_TEMP/lint.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "md_count=$(wc -l < "$RUNNER_TEMP/lint-md.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "--- files to lint ---"
          cat "$RUNNER_TEMP/lint.txt" || true

      - name: Prettier (changed markdown, yaml, json)
        if: steps.changed.outputs.lint_count != '0'
        run: xargs -r npx prettier --check < "$RUNNER_TEMP/lint.txt"

      - name: Markdownlint (changed markdown)
        if: steps.changed.outputs.md_count != '0'
        run: xargs -r npx markdownlint --config .markdownlintrc.json < "$RUNNER_TEMP/lint-md.txt"

      - name: YAML lint (GitHub Actions workflows)
        run: |
          npx yaml-lint .github/workflows/*.yml || true

      # Advisory: we squash-merge, and the merge commit carries the sign-off of whoever
      # merges. A missing trailer on a work-in-progress branch is a note, not a failure —
      # it was the single largest source of red builds and email for no safety gain.
      - name: DCO check (advisory)
        continue-on-error: true
        run: |
          bash tools/check_dco.sh ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Asset license gate
        run: |
          bash tools/check_asset_licenses.sh

      - name: Size gate (20 MB file / 5 MB binary without LFS)
        run: |
          bash tools/check_file_sizes.sh

      - name: Headless boot smoke (placeholder)
        run: |
          echo "=== HEADLESS BOOT SMOKE ==="
          echo "No engine selected yet — ballot open."
          echo "This step will run the engine's headless test suite when an engine is chosen."
          echo "For now: PASS (placeholder)"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
