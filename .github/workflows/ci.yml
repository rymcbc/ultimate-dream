name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (for prettier, markdownlint)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lint tools
        run: |
          npm ci 2>/dev/null || npm install --save-dev prettier markdownlint-cli @commitlint/cli @commitlint/config-conventional

      - name: Prettier (markdown, yaml, json)
        run: npx prettier --check "**/*.{md,yaml,yml,json}" "!node_modules/**"

      - name: Markdownlint
        run: npx markdownlint --ignore node_modules --config .markdownlintrc.json "**/*.md"

      - name: YAML lint (GitHub Actions workflows)
        run: |
          npx yaml-lint .github/workflows/*.yml || true

      - name: DCO check (signed commits)
        run: |
          bash tools/check_dco.sh ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Asset license gate
        run: |
          bash tools/check_asset_licenses.sh

      - name: Size gate (20 MB file / 5 MB binary without LFS)
        run: |
          bash tools/check_file_sizes.sh

      - name: Headless boot smoke (placeholder)
        run: |
          echo "=== HEADLESS BOOT SMOKE ==="
          echo "No engine selected yet — ballot open."
          echo "This step will run the engine's headless test suite when an engine is chosen."
          echo "For now: PASS (placeholder)"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
